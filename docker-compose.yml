services:
  postgres:
    # pgvector 확장이 포함된 이미지 - 표준 postgres:16 이미지 위에 `vector` 확장만
    # 얹은 것이라 env/ports/volumes/healthcheck는 전부 그대로 호환된다
    # (wiki/embeddings.md, knowledge_object_embeddings 테이블용).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kf
      POSTGRES_PASSWORD: kf
      POSTGRES_DB: knowledge_forge
    ports:
      - "15432:5432"
    volumes:
      - kf-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kf"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KF_DATABASE_URL: postgresql://kf:kf@postgres:5432/knowledge_forge
      KF_DATA_DIR: /app/data
      # Anthropic credentials pass through from the host shell - never
      # hardcode a key in this file. `ANTHROPIC_AUTH_TOKEN` covers the
      # `ant auth login` OAuth path if that's what the host has configured.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
    volumes:
      - ./data:/app/data
      - ./input:/app/input:ro
    # Default: initialize the schema so `docker compose up` proves the
    # wiring works end-to-end. Real work is run via `docker compose run`,
    # e.g.:
    #   docker compose run --rm app extract /app/input/sample.md --pretty
    #   docker compose run --rm app schedule /app/input --interval-seconds 3600
    command: ["db", "init"]

  # Broker + result backend for the Celery-based job transport (wiki/api.md)
  # that carries a job from `POST /ingest` to `worker`. The `jobs` Postgres
  # table above stays the source of truth for status/results.
  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # `POST /ingest` enqueues a job to the `jobs` table and returns 202
  # immediately - it never calls the LLM itself, so it needs no Anthropic
  # credentials (unlike `app`/`worker`). See wiki/api.md.
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KF_DATABASE_URL: postgresql://kf:kf@postgres:5432/knowledge_forge
      KF_DATA_DIR: /app/data
      KF_REDIS_URL: redis://redis:6379/0
      # Auto-scheduling (wiki/scheduling.md "serve 자동 스케줄링"): starting
      # this service is then enough to also periodically enqueue ingest
      # jobs - no separate `schedule` process/service needed. Empty by
      # default (no auto-scheduling). Example (uncomment/edit and set on the
      # host, or in a .env file docker compose reads):
      #   KF_SCHEDULED_SOURCES='[{"source":"local","path":"/app/input","interval_seconds":600,"okf_dir":"/app/okf"}]'
      KF_SCHEDULED_SOURCES: ${KF_SCHEDULED_SOURCES:-}
    ports:
      - "8000:8000"
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]

  # Consumes jobs dispatched over Redis and runs the actual pipeline for
  # each - the "process" half of Ingest/Process separation (wiki/roadmap.md
  # 4단계). Needs Anthropic credentials since it performs the real
  # extraction, unlike `api`.
  worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KF_DATABASE_URL: postgresql://kf:kf@postgres:5432/knowledge_forge
      KF_DATA_DIR: /app/data
      KF_REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
    volumes:
      - ./data:/app/data
      - ./input:/app/input:ro
      # Only needed when a job's `okf_dir` (e.g. from KF_SCHEDULED_SOURCES
      # above) points inside the container at /app/okf - worker.py's
      # _dispatch() is what actually writes the OKF tree, not `api`.
      - ./okf:/app/okf
    command: ["worker"]

  # Monitoring GUI for the Celery worker(s) above - reads the same Redis
  # broker, no app code/build needed. http://localhost:5555.
  flower:
    image: mher/flower:2.0
    depends_on:
      redis:
        condition: service_healthy
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    ports:
      - "5555:5555"

volumes:
  kf-postgres-data:
