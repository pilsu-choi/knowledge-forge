[project]
name = "knowledge-forge"
version = "0.1.0"
description = "Enterprise Knowledge Extraction Pipeline: Collector -> Parser -> Adaptive Chunker -> Knowledge Extraction -> Knowledge Object"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "anthropic>=0.69",
    "openai>=1.50",
    "typer>=0.12",
    "tiktoken>=0.8",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "tenacity>=9.0",
    "psycopg[binary]>=3.2",
    "apscheduler>=3.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
pptx = ["python-pptx>=1.0"]
hwpx = ["python-hwpx>=6.3"]
slack = ["slack-sdk>=3.27"]
google = ["google-api-python-client>=2.100", "google-auth>=2.30"]
notion = ["notion-client>=2.2"]
korean = ["kss>=6.0.4"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "reportlab>=4.2",
]

[project.scripts]
knowledge-forge = "knowledge_forge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
