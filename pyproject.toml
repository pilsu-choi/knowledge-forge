[project]
name = "knowledge-forge"
version = "0.1.0"
description = "Enterprise Knowledge Extraction Pipeline: Collector -> Parser -> Adaptive Chunker -> Knowledge Extraction -> Knowledge Object"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "anthropic>=0.69",
    "openai>=1.50",
    # KF_LLM_PROVIDER=claude_agent_sdk (wiki/llm-providers.md) - drives the
    # `claude` CLI as a subprocess instead of calling the Anthropic Messages
    # API directly, so extraction can run off an existing Claude Code OAuth
    # login instead of a separate ANTHROPIC_API_KEY. Kept a base dependency
    # (not an optional extra), matching anthropic/openai above, since
    # retry.py imports its exception types unconditionally.
    "claude-agent-sdk>=0.2",
    "typer>=0.12",
    "tiktoken>=0.8",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "lxml>=5.0",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "tenacity>=9.0",
    "psycopg[binary]>=3.2",
    # 검색 읽기 전용 커넥션 풀(storage/postgres_store.py::_read_conn). psycopg3의 async
    # 커넥션은 커넥션 하나에 대한 동시 실행을 내부 락으로 직렬화하기 때문에, 커넥션이
    # 하나뿐이면 asyncio.gather로 질의를 겹쳐도 아무 이득이 없다(실측: lexical_search 5회가
    # 순차 182ms / 한 커넥션 gather 183ms / 다섯 커넥션 gather 46ms). 별도 패키지인 이유는
    # psycopg가 풀을 코어에서 분리해 배포하기 때문 - `psycopg[pool]` extra와 같은 것이다.
    "psycopg-pool>=3.2",
    # pgvector column type adapter for psycopg3 (knowledge_object_embeddings,
    # wiki/embeddings.md) - openai (above) already covers the embedding API
    # client, no new dependency needed there.
    "pgvector>=0.3",
    "apscheduler>=3.10",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Job execution transport (celery_app.py) - the `jobs` Postgres table
    # stays the source of truth for job status/results, Celery+Redis is
    # only how a job gets from `POST /ingest` to a worker process. Adopted
    # so Flower (below) has a broker/worker to monitor - see wiki/api.md.
    "celery[redis]>=5.4",
    # Read-only MCP server (mcp_server.py, `knowledge-forge mcp`). Already
    # installed transitively via claude-agent-sdk; listed so the server
    # doesn't depend on that provider staying a dependency. 2.x API
    # (MCPServer, formerly FastMCP).
    "mcp>=2.1",
]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
pptx = ["python-pptx>=1.0"]
hwpx = ["python-hwpx>=6.3"]
slack = ["slack-sdk>=3.27"]
google = ["google-api-python-client>=2.100", "google-auth>=2.30"]
notion = ["notion-client>=2.2"]
korean = ["kss>=6.0.4"]
# Local dev only - docker-compose runs Flower from the standalone
# `mher/flower` image instead (no app code needed, see docker-compose.yml).
flower = ["flower>=2.0"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "reportlab>=4.2",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
knowledge-forge = "knowledge_forge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Line-length is a style preference, not a correctness gate, and this
# codebase's existing comment style runs long - not worth an 80-line
# rewrapping diff to enforce it retroactively. Revisit if `ruff format`
# is adopted later.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends(...)`/`Query(...)` and Typer's `Argument(...)`/
# `Option(...)` default-arg patterns are idiomatic, not the mutable-default-
# argument bug B008 exists to catch.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "typer.Argument",
    "typer.Option",
]

[tool.mypy]
# No explicit python_version pin: numpy's bundled stubs use 3.12+ `type`
# statement syntax that mypy can't parse under an older pinned target, so
# this follows whatever interpreter actually runs mypy (3.10+ per
# requires-python above) rather than forcing the floor version.
files = ["src/knowledge_forge"]
# Several optional SaaS-extra SDKs (slack_sdk, notion_client, kss,
# python-hwpx, ...) ship no type stubs - the gate is source-level type
# consistency within this codebase, not full third-party coverage.
ignore_missing_imports = true
