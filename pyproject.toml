[project]
name = "knowledge-forge"
version = "0.1.0"
description = "Enterprise Knowledge Extraction Pipeline: Collector -> Parser -> Adaptive Chunker -> Knowledge Extraction -> Knowledge Object"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "anthropic>=0.69",
    "openai>=1.50",
    # KF_LLM_PROVIDER=claude_agent_sdk (wiki/llm-providers.md) - drives the
    # `claude` CLI as a subprocess instead of calling the Anthropic Messages
    # API directly, so extraction can run off an existing Claude Code OAuth
    # login instead of a separate ANTHROPIC_API_KEY. Kept a base dependency
    # (not an optional extra), matching anthropic/openai above, since
    # retry.py imports its exception types unconditionally.
    "claude-agent-sdk>=0.2",
    "typer>=0.12",
    "tiktoken>=0.8",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "lxml>=5.0",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "tenacity>=9.0",
    "psycopg[binary]>=3.2",
    "apscheduler>=3.10",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Job execution transport (celery_app.py) - the `jobs` Postgres table
    # stays the source of truth for job status/results, Celery+Redis is
    # only how a job gets from `POST /ingest` to a worker process. Adopted
    # so Flower (below) has a broker/worker to monitor - see wiki/api.md.
    "celery[redis]>=5.4",
]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
pptx = ["python-pptx>=1.0"]
hwpx = ["python-hwpx>=6.3"]
slack = ["slack-sdk>=3.27"]
google = ["google-api-python-client>=2.100", "google-auth>=2.30"]
notion = ["notion-client>=2.2"]
korean = ["kss>=6.0.4"]
# Local dev only - docker-compose runs Flower from the standalone
# `mher/flower` image instead (no app code needed, see docker-compose.yml).
flower = ["flower>=2.0"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "reportlab>=4.2",
    "httpx>=0.27",
]

[project.scripts]
knowledge-forge = "knowledge_forge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
